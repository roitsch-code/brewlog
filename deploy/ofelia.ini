[global]
slack-only-on-error = true

# The "research" SCHEDULE was removed Aug 2026 (`0 6 */2 * *`). The route it
# called — src/app/api/research/route.ts — is deliberately KEPT, untouched and
# still CRON_SECRET-gated: this stops it running, it does not throw the agent
# away. Re-enabling it is pasting the four lines below back.
#
#   [job-exec "research"]
#   schedule = 0 6 */2 * *
#   container = brewlog-app-1
#   command = curl -sf -X POST http://localhost:3000/api/research -H "Authorization: Bearer ${CRON_SECRET}"
#   no-overlap = true
#
# Why it was stopped: it wrote four things into the knowledge store — insights,
# hints, questions, news — and the only code that reads ANY of them is the route
# itself and admin/seed, both purely to de-duplicate before writing again
# (checked: nothing else imports lib/knowledge/{insights,hints,news,questions}).
# So every 48 h it spent a model call to append rows no screen and no prompt has
# ever displayed. Its grounded, gated, actually-visible successor already exists:
# the monthly loading-insights agent (.github/workflows/loading-insights-refresh.yml
# → /api/loading-insights/refresh), whose lines the recipe-crafting screen shows.
#
# NB: ofelia reads this file at start-up, so dropping a job takes effect only
# once the ofelia container is recreated. deploy.yml recreates `app` alone (on
# purpose — see PR #218), so the old schedule keeps firing until then; it will
# hit a route that still exists and still works, which is exactly why removing
# the schedule without touching the route is the safe order of operations.

[job-exec "coffees-compact"]
schedule = 0 3 * * 1
container = brewlog-app-1
command = curl -sf -X POST http://localhost:3000/api/coffees/compact -H "Authorization: Bearer ${CRON_SECRET}"
no-overlap = true

# Daily at 04:00 — delete archived conversations older than 7 days.
# Active (non-archived) conversations are NEVER touched. See
# src/app/api/conversations/cleanup/route.ts for the 7-day rationale.
[job-exec "conversations-cleanup"]
schedule = 0 4 * * *
container = brewlog-app-1
command = curl -sf -X POST http://localhost:3000/api/conversations/cleanup -H "Authorization: Bearer ${CRON_SECRET}"
no-overlap = true
