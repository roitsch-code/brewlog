name: Recommend Logs (read-only)

# Pull the app container's RECENT recommend-related log lines off the VPS so a
# "Recommendation failed" report can be diagnosed from its actual error instead
# of a guess. Read-only: it only reads docker logs, it changes nothing.
#
# Push-triggered on a marker file (NOT workflow_dispatch): the integration token
# this repo's Claude sessions use cannot dispatch a workflow (403), so bumping
# `.github/recommend-logs-trigger` and merging is the established way to fire
# one. `.github/**` is paths-ignored by deploy.yml, so this never redeploys.
#
# STDIN TRAP (2026-08-17): the whole script is fed to the remote bash over
# stdin and `docker compose exec -T` READS stdin — every exec here must carry
# `</dev/null` or it swallows the rest of the script and later sections are
# silently skipped while the run still goes green.
#
# PUBLIC-REPO SAFETY: this repo is public, so run logs are public. Output is
# therefore filtered to recommendation-pipeline lines and their surrounding
# stack frames, every line is truncated to 300 chars, and the whole section is
# capped. It never cats the .env, never prints env values, and never runs
# `docker compose config`/`docker inspect` (all of which would interpolate
# secrets). Grep patterns are anchored to error/pipeline markers.

on:
  push:
    paths:
      - ".github/recommend-logs-trigger"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recommend errors from the VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash <<'REMOTE'
            set -uo pipefail
            cd ${{ secrets.DEPLOY_PATH }} || exit 1

            section() { printf '\n========== %s ==========\n' "$1"; }

            section "Container status"
            docker compose ps --format 'table {{.Name}}\t{{.Service}}\t{{.Status}}' || true

            section "App restarts / exit code"
            docker inspect --format '{{.Name}} restarts={{.RestartCount}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} started={{.State.StartedAt}}' \
              $(docker compose ps -q app) 2>/dev/null || echo "could not read app state"

            section "Memory (an OOM-killed generation looks like a failed recipe)"
            free -h

            # The error we are chasing. `recommend job error:` is logged by
            # /api/recommend/start when the detached generation rejects; the
            # stack frames follow it, so keep a window after each hit.
            section "recommend job errors (last 2000 log lines, 300 chars/line)"
            docker compose logs --tail=2000 --no-color app 2>/dev/null </dev/null \
              | grep -a -A 25 -iE 'recommend job error|Failed to parse recommendation' \
              | cut -c1-300 | tail -200 \
              || echo "no matching lines"

            section "Other pipeline errors + guard warnings (last 2000 lines)"
            docker compose logs --tail=2000 --no-color app 2>/dev/null </dev/null \
              | grep -a -iE '\[recommend\]|\[explore-agent\]|recommendProvider|anthropic|mistral|rate.?limit|overloaded|401|429|500 |ECONN|ETIMEDOUT|abort' \
              | grep -a -viE 'api[_-]?key|authorization|bearer|sk-' \
              | cut -c1-300 | tail -120 \
              || echo "no matching lines"

            # The chat's Brew pills are persisted verbatim in
            # conversation_messages.actions, so "the button did nothing" can be
            # diagnosed from what the pill actually carried: was there an id,
            # and does that id exist in coffees (the tap handler requires both
            # before it can seed the timer). Read-only SELECT; prints ids,
            # numbers and a short label — never full recipe text or prose.
            section "Latest chat start_brew / brew_again pills (id + library check)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT to_char(m.created_at AT TIME ZONE 'Europe/Berlin','MM-DD HH24:MI') AS at_local,
                     a->>'destination' AS dest,
                     COALESCE(a->>'id','(NO ID)') AS coffee_id,
                     EXISTS (SELECT 1 FROM coffees c WHERE c.id = a->>'id') AS in_library,
                     left(COALESCE(a->>'label',''),48) AS label,
                     (a->'recipe'->>'doseGrams') AS dose,
                     (a->'recipe'->>'waterGrams') AS water,
                     (a->'recipe'->>'waterTempC') AS temp,
                     (a->'recipe'->>'targetTimeSec') AS t_sec,
                     jsonb_array_length(COALESCE(a->'recipe'->'pourSteps','[]'::jsonb)) AS steps
              FROM conversation_messages m
              CROSS JOIN LATERAL jsonb_array_elements(m.actions) a
              WHERE m.actions IS NOT NULL
                AND a->>'destination' IN ('start_brew','brew_again')
              ORDER BY m.created_at DESC
              LIMIT 8;" </dev/null || echo "psql query failed"

            # The chat pill's ACTUAL recipe (2026-10-10, the "standard Hoffmann
            # V60 was thin, sour and the timer made no sense" report): until now
            # only the step COUNT was visible, so whether the chat bound its
            # basedOn to the verified reference, kept Hoffmann's pauses, wrote
            # the grind, or set a clock with any drawdown left could not be read
            # off production at all. Numbers only, never prose (public run log).
            # Steps format: action:gramsAtEnd@sec (sec = after cleanChatRecipe).
            section "Last 3 chat start_brew pills — full recipe numbers"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -x -c "
              SELECT to_char(m.created_at AT TIME ZONE 'Europe/Berlin','MM-DD HH24:MI') AS at_local,
                     COALESCE(a->>'id','(NO ID)') AS coffee_id,
                     left(COALESCE(a->>'label',''),48) AS label,
                     left(COALESCE(a->>'method',''),40) AS method,
                     left(COALESCE(a->>'basedOn',''),60) AS based_on,
                     left(COALESCE(a->>'title',''),48) AS title,
                     (a->'recipe'->>'doseGrams') AS dose,
                     (a->'recipe'->>'waterGrams') AS water,
                     (a->'recipe'->>'waterTempC') AS temp,
                     left(COALESCE(a->'recipe'->>'grindSize',''),40) AS grind,
                     (a->'recipe'->>'targetTimeSec') AS target_sec,
                     left(COALESCE(a->'recipe'->>'pourSequence',''),120) AS pour_sequence,
                     (SELECT string_agg(left(p->>'action',5) ||
                             COALESCE(':'||(p->>'waterGramsAtEnd'),'') || '@' || COALESCE(p->>'durationSec','?'),
                             ' ' ORDER BY ord)
                      FROM jsonb_array_elements(COALESCE(a->'recipe'->'pourSteps','[]'::jsonb))
                           WITH ORDINALITY t(p, ord)) AS steps
              FROM conversation_messages m
              CROSS JOIN LATERAL jsonb_array_elements(m.actions) a
              WHERE m.actions IS NOT NULL
                AND a->>'destination' = 'start_brew'
              ORDER BY m.created_at DESC
              LIMIT 3;" </dev/null | cut -c1-300 || echo "psql query failed"

            # The recipe a session ACTUALLY brewed, resolved exactly like
            # resolveBrewedRecipe (src/lib/utils/resolveRecipe.ts): the candidate
            # at brew.selectedCandidateIdx, else the candidate matching
            # brew.methodUsed, else primaryRecipe. Read-only; prints recipe
            # numbers, method, a short coffee name and the Acaia per-pour reach
            # times — never prose, never env. Expanded output (-x) so every field
            # is its own line and the 300-char cut never truncates a row.
            # Steps format: action:gramsAtEnd@authoredSec. Pours format:
            # label:targetG target@Xs actual@Ys (from brew.flowAnalysis.perPour).
            section "Last 10 brewed recipes (recipe numbers only)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -x -c "
              WITH s AS (
                SELECT created_at, coffee, context, recommendation, brew,
                       NULLIF(brew->>'selectedCandidateIdx','')::int AS idx
                FROM sessions
                WHERE recommendation IS NOT NULL
                ORDER BY created_at_ms DESC
                LIMIT 10
              ), r AS (
                SELECT created_at, coffee, context, brew, recommendation,
                  COALESCE(
                    CASE WHEN idx IS NOT NULL THEN recommendation->'candidates'->idx END,
                    (SELECT c FROM jsonb_array_elements(COALESCE(recommendation->'candidates','[]'::jsonb)) c
                       WHERE c->>'method' = brew->>'methodUsed' LIMIT 1),
                    jsonb_build_object('method', recommendation->>'primaryMethod',
                                       'recipe', recommendation->'primaryRecipe')) AS cand
                FROM s)
              SELECT to_char(created_at AT TIME ZONE 'Europe/Berlin','MM-DD HH24:MI') AS at_local,
                left(coffee->>'name',24) AS coffee,
                coffee->>'roastDate' AS roast_date,
                CASE WHEN recommendation->>'reasoning' = 'From the chat.' THEN 'chat' ELSE 'recommend' END AS source,
                left(COALESCE(brew->>'methodUsed', cand->>'method'),28) AS method,
                left(cand->>'basedOn',40) AS based_on,
                context->>'waterSource' AS water_source,
                cand->'recipe'->>'doseGrams' AS dose,
                cand->'recipe'->>'waterGrams' AS water,
                cand->'recipe'->>'waterTempC' AS temp,
                left(cand->'recipe'->>'grindSize',24) AS grind,
                brew->>'grindSettingUsed' AS grind_used,
                cand->'recipe'->>'targetTimeSec' AS target_sec,
                brew->>'actualTimeSec' AS actual_sec,
                (SELECT string_agg(left(p->>'action',5) ||
                        COALESCE(':'||(p->>'waterGramsAtEnd'),'') || '@' || COALESCE(p->>'durationSec','?'),
                        ' ' ORDER BY ord)
                 FROM jsonb_array_elements(COALESCE(cand->'recipe'->'pourSteps','[]'::jsonb))
                      WITH ORDINALITY t(p, ord)) AS steps,
                (SELECT string_agg(left(p->>'label',10) || ':' || COALESCE(p->>'targetGrams','?') ||
                        'g t@' || COALESCE(p->>'targetSec','?') || ' a@' || COALESCE(p->>'actualSec','-'),
                        ' | ' ORDER BY ord)
                 FROM jsonb_array_elements(COALESCE(brew->'flowAnalysis'->'perPour','[]'::jsonb))
                      WITH ORDINALITY t(p, ord)) AS measured_pours
              FROM r;" </dev/null | cut -c1-300 || echo "psql query failed"

            # Every candidate the app OFFERED (not just the brewed one) over the
            # last 30 recommendations — the repetition question ("Clever water-
            # first every other brew") is about what is offered, and only the
            # brewed recipe was visible before. Method + basedOn + the context
            # that drove it; no prose. Read-only.
            section "Last 30 recommendations — all offered candidates"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT to_char(s.created_at AT TIME ZONE 'Europe/Berlin','MM-DD HH24:MI') AS at_local,
                left(s.coffee->>'name',20) AS coffee,
                left(COALESCE(s.coffee->>'process',''),10) AS proc,
                left(COALESCE(s.context->>'intent',''),10) AS goal,
                left(COALESCE(s.context->>'occasion',''),12) AS occ,
                COALESCE(s.context->>'waterAmount', s.context->>'amount','') AS amt,
                left(COALESCE(s.context->>'preferredMethod',''),14) AS locked,
                s.brew->>'selectedCandidateIdx' AS picked,
                ord - 1 AS i,
                left(c->>'method',26) AS method,
                left(COALESCE(c->>'basedOn',''),44) AS based_on
              FROM (SELECT * FROM sessions WHERE recommendation IS NOT NULL
                    ORDER BY created_at_ms DESC LIMIT 30) s
              CROSS JOIN LATERAL jsonb_array_elements(COALESCE(s.recommendation->'candidates','[]'::jsonb))
                   WITH ORDINALITY t(c, ord)
              ORDER BY s.created_at_ms DESC, ord;" </dev/null | cut -c1-300 || echo "psql query failed"

            # The owner's ACTUAL pour pace (2026-10-10: "Who says my pace is
            # 4 g/s?"). POUR_RATE_GPS=4 was set by hand in June and re-stated
            # from ONE scale curve in October; the Acaia has recorded the mean
            # per-pour pour rate of every scale brew since (flowAnalysis.
            # avgFlowRateGPS, PR #556+). Read-only; numbers only.
            section "Owner's measured pour rate per scale brew (g/s, newest first)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT to_char(created_at AT TIME ZONE 'Europe/Berlin','MM-DD HH24:MI') AS at_local,
                     left(COALESCE(brew->>'methodUsed',''),22) AS method,
                     (brew->'flowAnalysis'->>'finalGrams') AS final_g,
                     (brew->'flowAnalysis'->>'avgPourRateGPS') AS pour_gps,
                     (brew->'flowAnalysis'->>'avgFlowRateGPS') AS avg_gps,
                     (brew->'flowAnalysis'->>'peakFlowRateGPS') AS peak_gps,
                     (brew->'flowAnalysis'->>'pourSteadiness') AS steadiness,
                     (brew->'flowAnalysis'->>'overshootG') AS overshoot_g,
                     jsonb_array_length(COALESCE(brew->'flowAnalysis'->'perPour','[]'::jsonb)) AS pours
              FROM sessions
              WHERE brew->'flowAnalysis'->>'avgFlowRateGPS' ~ '^[0-9.]+$'
              ORDER BY created_at_ms DESC
              LIMIT 25;" </dev/null | cut -c1-300 || echo "psql query failed"

            # avg_gps = grams ÷ (reach − previous reach), rest INCLUDED — not a pour
            # pace. pour_gps (since 2026-10-10) = grams ÷ the hand's pouring time.
            section "Owner's measured pour rate — median / quartiles over all scale brews (avg_gps, rest-inclusive)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT count(*) AS n,
                     round(percentile_cont(0.25) WITHIN GROUP (ORDER BY (brew->'flowAnalysis'->>'avgFlowRateGPS')::numeric)::numeric,2) AS p25,
                     round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (brew->'flowAnalysis'->>'avgFlowRateGPS')::numeric)::numeric,2) AS median,
                     round(percentile_cont(0.75) WITHIN GROUP (ORDER BY (brew->'flowAnalysis'->>'avgFlowRateGPS')::numeric)::numeric,2) AS p75
              FROM sessions
              WHERE brew->'flowAnalysis'->>'avgFlowRateGPS' ~ '^[0-9.]+$';" </dev/null || echo "psql query failed"

            section "Owner's HAND pour rate — median / quartiles (pour_gps, rest excluded; written since 2026-10-10)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT count(*) AS n,
                     round(percentile_cont(0.25) WITHIN GROUP (ORDER BY (brew->'flowAnalysis'->>'avgPourRateGPS')::numeric)::numeric,2) AS p25,
                     round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (brew->'flowAnalysis'->>'avgPourRateGPS')::numeric)::numeric,2) AS median,
                     round(percentile_cont(0.75) WITHIN GROUP (ORDER BY (brew->'flowAnalysis'->>'avgPourRateGPS')::numeric)::numeric,2) AS p75
              FROM sessions
              WHERE brew->'flowAnalysis'->>'avgPourRateGPS' ~ '^[0-9.]+$';" </dev/null || echo "psql query failed"

            # Which SEY bags exist — the 10-10 15:21 brew was pilled under
            # 'Wilson Alba' while the owner brewed 'Susan Meneses'.
            section "Library rows for roaster SEY (id, name, sessions, rotation)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT id, left(name,48) AS name, session_count, in_rotation, latest_roast_date
              FROM coffees WHERE roaster ILIKE '%sey%' ORDER BY id;" </dev/null || echo "psql query failed"

            section "Guard + menu-binding lines (last 5000 log lines)"
            docker compose logs --tail=5000 --no-color app 2>/dev/null </dev/null \
              | grep -a -iE 'not in this turn.s menu|recipe-fidelity|long-pour-gap|capacity guard|volume guard|physics: dropped|special' \
              | cut -c1-300 | tail -150 \
              || echo "no matching lines"

            # Ground truth for how long brews ACTUALLY run vs the clock they were
            # promised, per brewer label and 50 g volume bucket. Read-only.
            section "Actual vs promised time per method + volume (all sessions with both)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              WITH s AS (
                SELECT recommendation, brew,
                       NULLIF(brew->>'selectedCandidateIdx','')::int AS idx
                FROM sessions WHERE recommendation IS NOT NULL
              ), r AS (
                SELECT brew,
                  COALESCE(
                    CASE WHEN idx IS NOT NULL THEN recommendation->'candidates'->idx END,
                    (SELECT c FROM jsonb_array_elements(COALESCE(recommendation->'candidates','[]'::jsonb)) c
                       WHERE c->>'method' = brew->>'methodUsed' LIMIT 1),
                    jsonb_build_object('method', recommendation->>'primaryMethod',
                                       'recipe', recommendation->'primaryRecipe')) AS cand
                FROM s)
              SELECT left(lower(COALESCE(brew->>'methodUsed', cand->>'method')),30) AS method,
                (round((cand->'recipe'->>'waterGrams')::numeric/50)*50)::int AS vol,
                count(*) AS n,
                percentile_cont(0.5) WITHIN GROUP (ORDER BY (brew->>'actualTimeSec')::numeric
                   - (cand->'recipe'->>'targetTimeSec')::numeric) AS med_actual_minus_target,
                percentile_cont(0.5) WITHIN GROUP (ORDER BY (brew->>'actualTimeSec')::numeric) AS med_actual
              FROM r
              WHERE brew->>'actualTimeSec' ~ '^[0-9.]+$'
                AND cand->'recipe'->>'targetTimeSec' ~ '^[0-9.]+$'
                AND cand->'recipe'->>'waterGrams' ~ '^[0-9.]+$'
              GROUP BY 1,2 ORDER BY 1,2;" </dev/null | cut -c1-300 || echo "psql query failed"
          REMOTE

      # Second SSH step: GitHub refused to run the workflow once the first
      # step's script passed ~24 KB (run 38057143622, "workflow file issue",
      # zero jobs; proven by bisect on 2026-10-10 — the identical script minus
      # 2.4 KB ran green). Same preamble, same read-only rules.
      - name: Outcome ledger (read-only SQL over the owner's rated brews)
        run: |
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash <<'REMOTE'
            set -uo pipefail
            cd ${{ secrets.DEPLOY_PATH }} || exit 1

            section() { printf '\n========== %s ==========\n' "$1"; }

            # ──────────────────────────────────────────────────────────────
            # OUTCOME LEDGER (2026-10-03). Until this section existed, no
            # workflow, script or query in this repo ever selected a rating:
            # the app measured variety, physics and timing and never once
            # asked whether a cup got BETTER. Every query below is a read-only
            # SELECT over the owner's own home brews (mode='home', rated).
            # Prints counts and averages only — never prose, never env.
            # Coffee key = coffee->>'coffeeId', else roaster+name lowercased.
            # ──────────────────────────────────────────────────────────────
            section "OUTCOME LEDGER 0 — corpus size (home brews, rated)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT count(*) AS home_sessions,
                     count(*) FILTER (WHERE (result->>'rating') ~ '^[0-9.]+$') AS rated,
                     count(DISTINCT COALESCE(coffee->>'coffeeId', lower(coffee->>'roaster')||'__'||lower(coffee->>'name'))) AS coffees,
                     count(DISTINCT lower(coffee->>'roaster')) AS roasters,
                     min(created_at)::date AS first_brew, max(created_at)::date AS last_brew
              FROM sessions WHERE mode = 'home';" </dev/null || echo "psql query failed"

            section "OUTCOME LEDGER 1 — rating per month (is the average moving?)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT to_char(created_at AT TIME ZONE 'Europe/Berlin','YYYY-MM') AS month,
                     count(*) AS n,
                     round(avg((result->>'rating')::numeric),2) AS avg_rating,
                     round(100.0*count(*) FILTER (WHERE (result->>'rating')::numeric >= 4.5)/count(*)) AS pct_ge_4_5,
                     round(100.0*count(*) FILTER (WHERE (result->>'rating')::numeric <= 3)/count(*)) AS pct_le_3
              FROM sessions
              WHERE mode='home' AND (result->>'rating') ~ '^[0-9.]+$'
              GROUP BY 1 ORDER BY 1;" </dev/null || echo "psql query failed"

            section "OUTCOME LEDGER 2 — brew n vs brew n-1 of the SAME coffee, per quarter (does the next cup beat the last?)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              WITH r AS (
                SELECT created_at, (result->>'rating')::numeric AS rating,
                       COALESCE(coffee->>'coffeeId', lower(coffee->>'roaster')||'__'||lower(coffee->>'name')) AS ck
                FROM sessions WHERE mode='home' AND (result->>'rating') ~ '^[0-9.]+$'
              ), l AS (
                SELECT created_at, rating, ck,
                       lag(rating) OVER (PARTITION BY ck ORDER BY created_at) AS prev
                FROM r)
              SELECT to_char(created_at AT TIME ZONE 'Europe/Berlin','YYYY-\"Q\"Q') AS quarter,
                     count(*) AS pairs,
                     count(*) FILTER (WHERE rating > prev) AS improved,
                     count(*) FILTER (WHERE rating = prev) AS same,
                     count(*) FILTER (WHERE rating < prev) AS worse,
                     round(avg(rating - prev),2) AS mean_delta
              FROM l WHERE prev IS NOT NULL
              GROUP BY 1 ORDER BY 1;" </dev/null || echo "psql query failed"

            section "OUTCOME LEDGER 3 — rating by brew index of that coffee (1st, 2nd, 3rd, 4-6th, 7+; the session-arc question)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              WITH r AS (
                SELECT (result->>'rating')::numeric AS rating,
                       row_number() OVER (PARTITION BY COALESCE(coffee->>'coffeeId', lower(coffee->>'roaster')||'__'||lower(coffee->>'name')) ORDER BY created_at) AS idx
                FROM sessions WHERE mode='home' AND (result->>'rating') ~ '^[0-9.]+$')
              SELECT CASE WHEN idx=1 THEN '1st' WHEN idx=2 THEN '2nd' WHEN idx=3 THEN '3rd' WHEN idx<=6 THEN '4th-6th' ELSE '7th+' END AS brew_of_coffee,
                     count(*) AS n, round(avg(rating),2) AS avg_rating,
                     round(100.0*count(*) FILTER (WHERE rating >= 4.5)/count(*)) AS pct_ge_4_5
              FROM r GROUP BY 1 ORDER BY min(idx);" </dev/null || echo "psql query failed"

            section "OUTCOME LEDGER 4 — rating by what the brewed candidate was based on"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              WITH s AS (
                SELECT result, recommendation, brew, NULLIF(brew->>'selectedCandidateIdx','')::int AS idx
                FROM sessions WHERE mode='home' AND (result->>'rating') ~ '^[0-9.]+$'
              ), r AS (
                SELECT (result->>'rating')::numeric AS rating,
                  COALESCE(
                    CASE WHEN idx IS NOT NULL THEN recommendation->'candidates'->idx END,
                    (SELECT c FROM jsonb_array_elements(COALESCE(recommendation->'candidates','[]'::jsonb)) c
                       WHERE c->>'method' = brew->>'methodUsed' LIMIT 1)) AS cand
                FROM s)
              SELECT CASE
                       WHEN cand IS NULL THEN 'no candidate (chat/offline/legacy)'
                       WHEN cand->>'basedOn' ~* '^own experiment' THEN 'Own experiment'
                       WHEN cand->>'basedOn' ~* '^own recipe' THEN 'Own recipe'
                       WHEN cand->>'basedOn' ~* '^your ' THEN 'Own past brew (reference)'
                       WHEN COALESCE(cand->>'basedOn','') = '' THEN 'basedOn empty'
                       ELSE 'Named published recipe' END AS based_on_kind,
                     count(*) AS n, round(avg(rating),2) AS avg_rating,
                     round(100.0*count(*) FILTER (WHERE rating >= 4.5)/count(*)) AS pct_ge_4_5,
                     round(100.0*count(*) FILTER (WHERE rating <= 3)/count(*)) AS pct_le_3
              FROM r GROUP BY 1 ORDER BY n DESC;" </dev/null || echo "psql query failed"

            section "OUTCOME LEDGER 5 — best-fit slot (idx 0) vs exploration slot (idx 1)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT COALESCE(brew->>'selectedCandidateIdx','(none)') AS picked_idx,
                     count(*) AS n, round(avg((result->>'rating')::numeric),2) AS avg_rating,
                     round(100.0*count(*) FILTER (WHERE (result->>'rating')::numeric >= 4.5)/count(*)) AS pct_ge_4_5,
                     round(100.0*count(*) FILTER (WHERE (result->>'rating')::numeric <= 3)/count(*)) AS pct_le_3
              FROM sessions WHERE mode='home' AND (result->>'rating') ~ '^[0-9.]+$'
              GROUP BY 1 ORDER BY 1;" </dev/null || echo "psql query failed"

            section "OUTCOME LEDGER 6 — rating by brewer (label as logged, n>=3)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT left(lower(COALESCE(brew->>'methodUsed', recommendation->>'primaryMethod','?')),30) AS method,
                     count(*) AS n, round(avg((result->>'rating')::numeric),2) AS avg_rating,
                     round(100.0*count(*) FILTER (WHERE (result->>'rating')::numeric >= 4.5)/count(*)) AS pct_ge_4_5
              FROM sessions WHERE mode='home' AND (result->>'rating') ~ '^[0-9.]+$'
              GROUP BY 1 HAVING count(*) >= 3 ORDER BY avg_rating DESC, n DESC;" </dev/null || echo "psql query failed"

            section "OUTCOME LEDGER 7 — coach insights: status counts + avg rating 21 days before vs after each saved/confirmed insight (approximation)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT status, source, count(*) FROM insights GROUP BY 1,2 ORDER BY 1,2;" </dev/null || echo "psql query failed"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT to_char(i.created_at AT TIME ZONE 'Europe/Berlin','MM-DD') AS saved, i.status, left(i.observation,50) AS observation,
                     (SELECT round(avg((s.result->>'rating')::numeric),2) FROM sessions s WHERE s.mode='home' AND (s.result->>'rating') ~ '^[0-9.]+$'
                        AND s.created_at BETWEEN i.created_at - interval '21 days' AND i.created_at) AS avg_before,
                     (SELECT round(avg((s.result->>'rating')::numeric),2) FROM sessions s WHERE s.mode='home' AND (s.result->>'rating') ~ '^[0-9.]+$'
                        AND s.created_at BETWEEN i.created_at AND i.created_at + interval '21 days') AS avg_after,
                     (SELECT count(*) FROM sessions s WHERE s.mode='home' AND (s.result->>'rating') ~ '^[0-9.]+$'
                        AND s.created_at BETWEEN i.created_at AND i.created_at + interval '21 days') AS n_after
              FROM insights i WHERE i.status IN ('trying','confirmed','doesnt-apply')
              ORDER BY i.created_at DESC LIMIT 15;" </dev/null | cut -c1-300 || echo "psql query failed"

            section "OUTCOME LEDGER 8 — last 12 rated brews with the previous brew of the same coffee (the raw pairs)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              WITH r AS (
                SELECT created_at, coffee, brew, recommendation, (result->>'rating')::numeric AS rating,
                       COALESCE(coffee->>'coffeeId', lower(coffee->>'roaster')||'__'||lower(coffee->>'name')) AS ck,
                       NULLIF(brew->>'selectedCandidateIdx','')::int AS idx
                FROM sessions WHERE mode='home' AND (result->>'rating') ~ '^[0-9.]+$'
              ), l AS (
                SELECT *, lag(rating) OVER (PARTITION BY ck ORDER BY created_at) AS prev_rating,
                       lag(brew->>'methodUsed') OVER (PARTITION BY ck ORDER BY created_at) AS prev_method
                FROM r)
              SELECT to_char(created_at AT TIME ZONE 'Europe/Berlin','MM-DD') AS at_local, left(coffee->>'name',18) AS coffee,
                     left(COALESCE(brew->>'methodUsed',''),16) AS method, rating,
                     left(COALESCE(recommendation->'candidates'->idx->>'basedOn',''),30) AS based_on,
                     prev_rating, left(COALESCE(prev_method,''),16) AS prev_method
              FROM l ORDER BY created_at DESC LIMIT 12;" </dev/null | cut -c1-300 || echo "psql query failed"

            section "OUTCOME LEDGER 9 — the user's own verdict vs the previous brew of the same coffee (since 2026-10-03)"
            docker compose exec -T postgres psql -U brewlog -d brewlog -P pager=off -c "
              SELECT COALESCE(result->>'vsPrevious','(not answered)') AS vs_previous, count(*) AS n,
                     round(avg((result->>'rating')::numeric - NULLIF(result->>'previousRating','')::numeric),2) AS mean_star_delta
              FROM sessions WHERE mode='home' AND (result->>'rating') ~ '^[0-9.]+$'
                AND created_at >= '2026-10-03'
              GROUP BY 1 ORDER BY n DESC;" </dev/null || echo "psql query failed"

            section "Unhandled rejections / crashes (last 2000 lines)"
            docker compose logs --tail=2000 --no-color app 2>/dev/null </dev/null \
              | grep -a -A 15 -iE 'UnhandledPromiseRejection|FATAL ERROR|heap out of memory|TypeError|RangeError' \
              | cut -c1-300 | tail -120 \
              || echo "no matching lines"

            section "Done"
          REMOTE
