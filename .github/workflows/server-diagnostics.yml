name: Server Diagnostics (read-only)

# Read-only health/topology check of the Hetzner VPS, driven from the GitHub
# Actions UI (Actions tab → "Server Diagnostics (read-only)" → "Run workflow")
# so it works from the phone with no terminal.
#
# Reuses the existing deploy SSH key + DEPLOY_* secrets, exactly like
# deploy.yml and migration.yml. There is NO command input: every command below
# is fixed and read-only, so this workflow can neither change anything on the
# server nor be coaxed into running an arbitrary command.
#
# STDIN TRAP (hit on the first run, 2026-08-17): this whole script is fed to
# the remote bash over stdin, and `docker compose exec -T` READS stdin — so the
# first exec swallowed the rest of the script and every section after it was
# silently skipped. The run still went green, which is the nasty part. Every
# `docker compose exec` here must therefore carry `</dev/null`.
#
# SECRET SAFETY: this never prints secret VALUES into the run log. It does NOT
# `cat` the .env, does NOT run `docker compose config` and does NOT
# `docker inspect` containers (all of those would interpolate/expose env
# values). It only reports the .env's permissions/owner via `ls -l`.
#
# ONE narrow exception, added Aug 2026: the two PROVIDER SWITCHES
# (RECOMMEND_PROVIDER, COACH_PROVIDER) are printed with their values. They are
# not credentials — they hold "mistral", "anthropic" or nothing, and which model
# answers a recipe is a fact about the app, not a secret. Every API key is
# reported as present/absent ONLY, value never read. The greps are anchored to
# those exact variable names, so no other line of the .env can be emitted.
#
# Why this is worth a workflow: after rolling /recommend back to Opus in code,
# the one thing unverifiable from a Claude Code session was whether the VPS .env
# carries an explicit RECOMMEND_PROVIDER=mistral, which would override the code
# default and make the rollback a silent no-op. Guessing was not acceptable.

on:
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Run read-only diagnostics on VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash <<'REMOTE'
            set -uo pipefail
            cd ${{ secrets.DEPLOY_PATH }} || true

            section() { printf '\n========== %s ==========\n' "$1"; }

            section "Identity (deploy user / groups)"
            whoami; id; groups

            section "OS"
            uname -a
            cat /etc/os-release 2>/dev/null | grep -E '^(PRETTY_NAME|VERSION)=' || true

            section "CPU / RAM / Disk"
            echo "nproc: $(nproc)"
            free -h
            df -h /

            section "Docker / Compose versions"
            docker --version || echo "docker not on PATH for this user"
            docker compose version || echo "compose v2 not available"

            section "Docker networks  (expect brewlog_default)"
            docker network ls || echo "no docker access for this user"

            section "Running containers"
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true

            section "Docker volumes"
            docker volume ls || true

            section "Live resource usage (one-shot)"
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' || true

            section ".env permissions/owner  (NOT contents)"
            ls -l "${{ secrets.DEPLOY_PATH }}/.env" 2>/dev/null || echo ".env not found at deploy path"

            section "AI provider switches  (values shown — NOT credentials)"
            # Anchored to these exact names: no other .env line can be printed.
            # Reports three states, because they are three different situations:
            # a value set (it WINS over the code default), the key present but
            # empty (the code default decides), or the line absent entirely
            # (same effect as empty, but says nobody ever set it).
            for v in RECOMMEND_PROVIDER COACH_PROVIDER; do
              line=$(grep -E "^${v}=" "${{ secrets.DEPLOY_PATH }}/.env" 2>/dev/null | tail -1)
              if [ -z "$line" ]; then
                echo "  .env  $v: not present  → code default decides"
              elif [ "$line" = "${v}=" ]; then
                echo "  .env  $v: present but EMPTY  → code default decides"
              else
                echo "  .env  ${line}   ← explicit, OVERRIDES the code default"
              fi
            done

            # The .env is what the container was STARTED with, which can drift
            # from the file if nobody recreated it since the last edit. This is
            # the value the running app actually reads.
            for v in RECOMMEND_PROVIDER COACH_PROVIDER; do
              val=$(docker compose exec -T app printenv "$v" 2>/dev/null </dev/null | tr -d '\r')
              if [ -z "$val" ]; then
                echo "  live  $v: empty in the running container  → code default decides"
              else
                echo "  live  $v=$val   ← the running app uses this"
              fi
            done

            section "AI keys  (presence only — values never read)"
            for v in ANTHROPIC_API_KEY MISTRAL_API_KEY MISTRAL_COACH_API_KEY; do
              if docker compose exec -T app sh -c "[ -n \"\$$v\" ]" 2>/dev/null </dev/null; then
                echo "  $v: set"
              else
                echo "  $v: NOT set"
              fi
            done

            section "Caddyfile  (no secrets — domains only)"
            cat "${{ secrets.DEPLOY_PATH }}/Caddyfile" 2>/dev/null || echo "Caddyfile not found"

            section "Crontab of this user  (backup cron lives in host crontab)"
            crontab -l 2>/dev/null || echo "no crontab for $(whoami) (it may live under root)"

            section "Done"
          REMOTE
