name: Cron cleanup (one-shot)

# One-shot: removes the dead host-crontab entry that runs the old e-mail
# backup script scripts/backup-db.sh (it fails nightly with "Permission
# denied"; the real backup is deploy/backup.sh). Owner-approved 2026-10-12.
#
# Safety: saves a copy of each crontab before touching it, removes ONLY lines
# containing scripts/backup-db.sh, aborts if more than 3 lines match, and
# aborts if the number of deploy/backup.sh lines would change.
# Prints only backup-related lines, with anything after "Bearer" masked.

on:
  push:
    paths:
      - ".github/cron-cleanup-trigger"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the dead backup-db.sh cron entry
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash <<'REMOTE'
            set -uo pipefail
            DEAD='scripts/backup-db.sh'
            LIVE='deploy/backup.sh'
            STAMP=$(date +%Y%m%d-%H%M%S)
            mask() { grep -i 'backup' | sed -E 's/Bearer.*/Bearer ***/I; s/([A-Za-z_]*(SECRET|KEY|TOKEN|PASS)[A-Za-z_]*=)[^ ]*/\1***/gI' || true; }

            clean() {  # $1 = label, $2 = command prefix ("" or "sudo -n")
              local label="$1" pre="$2" cur new dead live_before live_after
              if ! cur=$($pre crontab -l 2>/dev/null </dev/null); then
                echo "[$label] no crontab (or not readable)"; return 0
              fi
              echo "[$label] backup-related lines BEFORE:"; printf '%s\n' "$cur" | mask
              dead=$(printf '%s\n' "$cur" | grep -cF "$DEAD" || true)
              live_before=$(printf '%s\n' "$cur" | grep -cF "$LIVE" || true)
              echo "[$label] lines with $DEAD: $dead · lines with $LIVE: $live_before"
              [ "$dead" -eq 0 ] && { echo "[$label] nothing to remove"; return 0; }
              [ "$dead" -le 3 ] || { echo "ABORT [$label]: $dead matching lines, expected ≤3" >&2; exit 1; }
              new=$(printf '%s\n' "$cur" | grep -vF "$DEAD" || true)
              live_after=$(printf '%s\n' "$new" | grep -cF "$LIVE" || true)
              [ "$live_after" -eq "$live_before" ] || { echo "ABORT [$label]: would change the $LIVE entry" >&2; exit 1; }
              if [ -z "$pre" ]; then
                printf '%s\n' "$cur" > "$HOME/crontab-backup-$STAMP.txt"
                echo "[$label] copy saved to ~/crontab-backup-$STAMP.txt"
              else
                printf '%s\n' "$cur" | $pre tee "/root/crontab-backup-$STAMP.txt" >/dev/null
                echo "[$label] copy saved to /root/crontab-backup-$STAMP.txt"
              fi
              printf '%s\n' "$new" | $pre crontab - || { echo "ABORT [$label]: crontab write failed" >&2; exit 1; }
              echo "[$label] backup-related lines AFTER:"; $pre crontab -l 2>/dev/null </dev/null | mask
              [ "$($pre crontab -l 2>/dev/null </dev/null | grep -cF "$DEAD" || true)" -eq 0 ] \
                || { echo "ABORT [$label]: entry still present" >&2; exit 1; }
              echo "[$label] removed $dead line(s)"
            }

            clean "$(whoami)" ""
            if [ "$(whoami)" != root ] && sudo -n true 2>/dev/null </dev/null; then
              clean root "sudo -n"
            fi
            echo "Done."
          REMOTE
